name: Backtest data

on:
  workflow_dispatch:
    inputs:
      coins:
        description: "'config' (universe + BTC) or e.g. BTC,ETH,SOL"
        type: string
        default: "config"
      start:
        description: "History start date"
        type: string
        default: "2024-06-01"

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: pip install -q -r requirements.txt

      - name: Download MEXC history
        run: |
          python backtest/history.py --coins "${{ inputs.coins }}" --from "${{ inputs.start }}" | tee history.log
          { echo '### History download'; echo '```'; cat history.log; echo '```'; du -sh data/history; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to history-data branch
        run: |
          tmp="$RUNNER_TEMP/pub"; mkdir -p "$tmp"
          cp -r data/history "$tmp"/
          cd "$tmp"
          git init -q -b history-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "history $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" history-data
