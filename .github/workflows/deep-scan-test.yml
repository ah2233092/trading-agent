name: Deep scan test

on:
  workflow_dispatch:
    inputs:
      coins:
        description: "Coins to deep scan, e.g. BTC,SOL"
        type: string
        default: "BTC,SOL"

permissions:
  contents: write

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: pip install -q -r requirements.txt

      - name: Offline tests
        run: |
          python tests/test_smc.py
          python tests/test_phase2.py

      - name: Live deep scan
        env:
          COINS: ${{ inputs.coins }}
        run: |
          mkdir -p out
          {
            echo "## Live deep scan — $(date -u +'%Y-%m-%d %H:%M') UTC"
          } >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -ra list <<< "$COINS"
          status=0
          for c in "${list[@]}"; do
            c="$(echo "$c" | xargs)"
            [ -z "$c" ] && continue
            echo "::group::deep scan $c"
            if python lib/deep_scan.py --symbol "$c" --no-git > "out/$c.txt" 2> "out/$c.err"; then
              res="ok"
            else
              res="FAILED"; status=1
            fi
            python lib/deep_scan.py --symbol "$c" --no-git --no-charts --json > "out/$c.json" 2>> "out/$c.err" || true
            cat "out/$c.txt"; cat "out/$c.err"
            echo "::endgroup::"
            {
              echo "### $c — $res"
              echo '```'
              cat "out/$c.txt"
              echo '```'
              if [ -s "out/$c.err" ]; then
                echo "<details><summary>stderr</summary>"; echo; echo '```'; tail -n 40 "out/$c.err"; echo '```'; echo "</details>"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - name: Publish charts to scan-output branch
        if: always()
        run: |
          [ -d charts ] || exit 0
          tmp="$RUNNER_TEMP/pub"; mkdir -p "$tmp"
          cp -r charts out "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          git init -q -b scan-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "deep scan output $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" scan-output

      - name: Upload charts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-scan-output
          path: |
            out/
            charts/
          if-no-files-found: ignore
          retention-days: 7
