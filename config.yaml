# ===== Trading Agent config =====

exchange: mexc
market_type: swap            # USDT-M perpetual futures
quote: USDT
# Used only when the main exchange is unreachable (e.g. GitHub's US runners
# blocked). Same coins, same USDT-M perpetual symbols, public data only.
fallback_exchanges: [gate, bitget, kucoinfutures, okx]

# --- Coin universe ---
universe:
  mode: top_volume           # top_volume or fixed
  top_n: 30
  fixed: [BTC, ETH, SOL, XRP, BNB, DOGE, ADA, AVAX, LINK, SUI]
  exclude: [XAU, XAUT, PAXG, XAG, SILVER, GOLD, OIL, USOIL, UKOIL, NATGAS, SOXS, SOXL, TQQQ, SQQQ, SPY, QQQ, TSLA, TESLA, NVDA, AAPL, MSFT, AMZN, GOOGL, META, MSTR, COIN, HOOD, AMD, NFLX, PLTR, CRCL, INTC, BABA]   # not crypto (metals, oil, stocks, ETFs)
  exclude_suffixes: [STOCK]   # tokenized stocks like MUSTOCK
  min_24h_volume_usd: 20000000
  max_spread_pct: 0.08

# --- Timeframes ---
timeframes:
  bias: [1d, 4h]
  setup: 1h
  entry: 15m

# --- Watchman scanner (Stage 1) ---
scanner:
  min_alert_score: 60        # light score needed to send a Telegram alert
  max_alerts_per_run: 3
  coin_cooldown_hours: 6
  swing_length: 5
  volume_spike_mult: 2.0
  near_poi_pct: 0.6          # price within this % of an HTF OB/FVG/key level
  fresh_candles: 3           # sweep / BOS / CHoCH counts as "fresh" within the last N closed 1H candles
  pending_expire_hours: 24   # pending alerts older than this move to alerts/history as "expired"
alert_max_age_hours: 3

# --- SMC details (Stage 2) ---
smc:
  ltf_swing_length: 3        # 15m swing length for the LTF CHoCH confirmation
  setup_lookback_1h: 36      # model A: look back N 1H candles for sweep -> CHoCH
  poi_tap_lookback_1h: 8     # model B: 4H POI must be tapped within the last N 1H candles
  ltf_lookback_15m: 32       # 15m confirmation window (32 x 15m = 8h)
  killzones_utc:             # [start_hour, end_hour) UTC
    asia: [0, 6]
    london: [7, 10]
    new_york: [12, 15]

# --- Deep scan (Stage 2) ---
min_trade_score: 65
score_weights:
  htf_bias: 25
  smc_setup: 25
  entry_precision: 15
  displacement_volume: 10
  futures_data: 10
  session_timing: 5
  news: 5
  backtest_edge: 5
btc_dump_pct: 2.0            # BTC 1H drop % that blocks alt longs
funding_extreme: 0.05        # % per funding period
long_short_extreme: 3.0      # L/S account ratio above this (or below 1/this) = crowded
futures_data_fallbacks: [okx, binanceusdm, bybit]   # for OI history / L/S ratio (MEXC has none)
news_block_hours: 2

# --- Live entry rule (from the Oct 2026 backtest) ---
entry_mode: market_in_killzone   # market entry from the current price, only in London / NY killzones
max_trades_per_day: 0            # 0 = no maximum (Rans: trades jitni marzi)
min_signals_per_day: 2           # 2 killzone digests a day with the top 2 coins
allow_b_plan: true               # plan ok but score / killzone short -> 🟡 B-PLAN instead of NO TRADE
b_plan_min_score: 45           # more B-plans -> more trade options a day
max_losses_per_day: 3            # safety: stop for the day after 3 stop-losses

# --- Risk ---
account_balance: 20
risk_per_trade_usd: 2.0     # Rans chose $2 risk -> ~$6 per winning trade
risk_per_trade_pct: 10
max_margin_per_trade: 10
max_leverage: 20
margin_mode: isolated
min_rr_tp1: 2.0            # flexible: TP1 = first good level at >= 1:2 (profit depends on the setup)
min_rr_final: 3.0
tp1_close_pct: 50          # half at TP1, SL to entry, rest runs to TP2/TP3 for bigger profit
min_profit_usd: 0          # no fixed minimum profit
blocker_min_r: 0.25         # level closer than this = price already testing it, not a blocker
blocker_max_r: 1.0          # only a strong level inside 1R blocks the trade
sl_atr_buffer: 0.3
liq_buffer_pct: 1.5
plan_valid_hours: 6

# --- Notifications ---
telegram:
  enabled: true              # token + chat id come from env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
timezone_display: Asia/Karachi

# --- Backtest (Phase 3) ---
backtest:
  slippage_pct: 0.02         # extra cost on market fills / stop exits
  max_hold_hours: 168        # close a trade at market after 7 days
